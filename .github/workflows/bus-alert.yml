name: bus-alert

on:
  workflow_dispatch:

concurrency:
  group: bus-alert
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Watch the bus
        run: python bus_alert.py --force
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ROUTE: "3X"
          STOP_NAME: "Montgomery,Kemper"
          WALK_MIN: "8"
          BUFFER_MIN: "3"
          TARGET_TIMES: "07:40,08:10"
          TOL_MIN: "6"
          WEATHER_UNTIL: "18:00"
